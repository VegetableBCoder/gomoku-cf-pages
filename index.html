<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓜皮五子棋 · WebGPU</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "onnxruntime-web/webgpu": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.bundle.min.mjs"
  }
}
</script>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>瓜皮五子棋</h1>
      <p class="sub">15×15 · 自由规则（连五即胜）</p>

      <div class="row">
        <label for="human-color">执子</label>
        <select id="human-color">
          <option value="black" selected>黑（先手）</option>
          <option value="white">白（后手）</option>
        </select>
      </div>

      <div class="row">
        <label for="model">模型</label>
        <select id="model">
          <option value="fp16" selected>fp16 · 15 MB</option>
        </select>
      </div>

      <div class="row">
        <label for="temperature">温度</label>
        <input id="temperature" type="number" value="0" min="0" max="2" step="0.1">
      </div>

      <div class="row buttons">
        <button id="new-game" type="button">新对局</button>
        <button id="undo" type="button">悔棋</button>
      </div>

      <div class="status-box">
        <div id="status">准备中…</div>
        <div id="eval" class="eval"></div>
      </div>

      <div id="engine-info" class="info">初始化…</div>

      <p class="hint">
        左键落子。温度 0 = 贪心取最大概率，&gt;0 按概率采样。
        首次加载需下载约 15 MB 模型（fp16），之后由浏览器缓存。
      </p>
    </section>

    <section class="board-wrap">
      <canvas id="board"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
